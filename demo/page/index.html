<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoThinker</title>
<style>
  html, body { margin: 0; height: 100%; background: #101418; color: #e8eaed;
    font-family: system-ui, sans-serif; }
  #app { display: flex; height: 100vh; }
  #jitsi { flex: 0 0 62%; min-width: 0; background: #000; }
  #stage { flex: 1 1 38%; min-width: 0; border: 0; background: #fff; }
  #namebox { position: fixed; inset: 0; display: none; align-items: center;
    justify-content: center; background: #101418; z-index: 10; }
  #namebox form { display: flex; gap: .5rem; align-items: center; }
  #namebox input { padding: .6rem; font-size: 1rem; border-radius: 4px;
    border: 1px solid #5f6368; background: #1b2026; color: inherit; }
  #namebox button { padding: .6rem 1rem; font-size: 1rem; border: 0;
    border-radius: 4px; background: #3b82f6; color: #fff; cursor: pointer; }
  #err { position: fixed; top: 1rem; left: 1rem; color: #f28b82; }
  @media (max-width: 900px) {
    #app { flex-direction: column; }
    #jitsi { flex: 0 0 55%; }
    #stage { flex: 1 1 45%; }
  }
</style>
</head>
<body>
<div id="namebox">
  <form id="nameform">
    <label for="name">Your name</label>
    <input id="name" maxlength="40" required autofocus>
    <button type="submit">Join</button>
  </form>
</div>
<div id="err"></div>
<div id="app">
  <div id="jitsi"></div>
  <iframe id="stage" title="CoThinker stage"></iframe>
</div>
<script>
(function () {
  function getCookie(k) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  function setCookie(k, v) {
    document.cookie = k + '=' + encodeURIComponent(v) +
      '; path=/demo/; max-age=' + (30 * 86400) + '; SameSite=Lax; Secure';
  }
  function fail(msg) { document.getElementById('err').textContent = msg; }

  function start(name) {
    var q = location.search || '?';
    var url = 'api/session' + q + (q === '?' ? '' : '&') +
      'name=' + encodeURIComponent(name);
    fetch(url, {cache: 'no-store'}).then(function (r) {
      if (!r.ok) throw new Error('session ' + r.status);
      return r.json();
    }).then(function (s) {
      var sc = document.createElement('script');
      sc.src = 'https://' + s.domain + '/external_api.js';
      sc.onerror = function () { fail('Could not load the meeting.'); };
      sc.onload = function () {
        new JitsiMeetExternalAPI(s.domain, {
          roomName: s.room,
          jwt: s.jwt,
          parentNode: document.getElementById('jitsi'),
          width: '100%', height: '100%',
          userInfo: {displayName: name},
          configOverwrite: {
            prejoinConfig: {enabled: false},
            startWithVideoMuted: false,
            disableDeepLinking: true,
            disableInitialGUM: false
          },
          interfaceConfigOverwrite: {}
        });
      };
      document.head.appendChild(sc);
      document.getElementById('stage').src = s.stage_path;
    }).catch(function () { fail('This link is not valid.'); });
  }

  var name = getCookie('ct_demo_name');
  if (name) { start(name); return; }
  var box = document.getElementById('namebox');
  box.style.display = 'flex';
  document.getElementById('nameform').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('name').value.trim();
    if (!v) return;
    setCookie('ct_demo_name', v);
    box.style.display = 'none';
    start(v);
  });
})();
</script>
</body>
</html>
