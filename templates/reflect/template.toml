# Template format: blocks + phases + rules, no code (ADR 0009).
[template]
name = "reflect"
api_version = 1
surfaces = ["stage"]
optional_surfaces = ["external-display"]
rules = ["grounding", "add-dont-restructure"]

[[blocks]]
id = "capture-bullets"
[[blocks]]
id = "topics"
threshold = 0.70
min_topic_age_s = 90.0
titles = false
[[blocks]]
id = "decisions-tasks-questions"
[[blocks]]
id = "condense"
prompt = "prompts/condense.{lang}.md"
[[blocks]]
id = "minutes-document"
[[blocks]]
id = "mirroring-coach"
[[blocks]]
id = "knowledge-link"
[[blocks]]
id = "timer"
[[blocks]]
id = "speaker-queue"
[[blocks]]
id = "speaking-share"
[[blocks]]
id = "status-line"
[[blocks]]
id = "graph"

[[phases]]
id = "session"
titles = { de = "Sitzung", en = "Session" }
blocks = ["capture-bullets", "topics", "decisions-tasks-questions", "condense",
          "minutes-document", "mirroring-coach", "knowledge-link", "timer",
          "speaker-queue", "speaking-share", "status-line", "graph"]
surfaces = ["stage"]
