asyncapi: 3.0.0
info:
  title: CoThinker surface contract -- push channel
  version: 0.1.0
  description: View intents pushed by the surface contract's fixture-mode server over
    server-sent events (ADR 0019, ADR 0006).
channels:
  viewIntents:
    address: /events
    messages:
      viewIntent:
        $ref: '#/components/messages/viewIntent'
operations:
  sendViewIntent:
    action: send
    channel:
      $ref: '#/channels/viewIntents'
    summary: The server sends one view intent per SSE event.
    messages:
    - $ref: '#/channels/viewIntents/messages/viewIntent'
components:
  messages:
    viewIntent:
      name: viewIntent
      title: View intent
      payload:
        $ref: '#/components/schemas/ViewIntent'
  schemas:
    AgendaItemSummary:
      description: 'One item of the full agenda list -- not wired yet, see issue #129.'
      properties:
        title:
          description: The agenda item's title.
          examples:
          - 'Retro: what worked'
          title: Title
          type: string
        budget_s:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: Planned duration in seconds.
          examples:
          - 600.0
          title: Budget S
        status:
          description: Where this item stands relative to the current one.
          enum:
          - done
          - current
          - next
          - open
          examples:
          - current
          title: Status
          type: string
      required:
      - title
      - status
      title: AgendaItemSummary
      type: object
    ArtefactIntent:
      properties:
        kind:
          const: artefact
          default: artefact
          title: Kind
          type: string
        id:
          description: Identity a user action refers back to.
          examples:
          - VI5
          title: Id
          type: string
        label:
          description: Label for the artefact.
          examples:
          - Session graph, round 2
          title: Label
          type: string
        url:
          description: Where the artefact can be fetched.
          examples:
          - https://example.invalid/artefacts/graph-2.png
          title: Url
          type: string
        media_type:
          description: MIME type of the artefact.
          examples:
          - image/png
          title: Media Type
          type: string
      required:
      - id
      - label
      - url
      - media_type
      title: ArtefactIntent
      type: object
    ChoiceIntent:
      properties:
        kind:
          const: choice_list
          default: choice_list
          title: Kind
          type: string
        id:
          description: Identity a user action refers back to.
          examples:
          - VI2
          title: Id
          type: string
        to_person:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Who the choice is directed at; `None` is everyone.
          examples:
          - Jonas
          title: To Person
        question:
          description: The question the choices answer.
          examples:
          - Which topic next?
          title: Question
          type: string
        options:
          description: The offered choices, in display order.
          examples:
          - - Budget
            - Timeline
            - Risks
          items:
            type: string
          title: Options
          type: array
        allow_multiple:
          default: false
          description: Whether more than one option may be chosen.
          examples:
          - false
          title: Allow Multiple
          type: boolean
      required:
      - id
      - question
      - options
      title: ChoiceIntent
      type: object
    GraphIntent:
      description: '`graph:session`: the graph block''s view intent (kind `graph`,

        `blocks/graph/__init__.py::GraphBlock._build()`); the same shape as

        `StageStateSnapshot.session_graph`, plus the envelope''s `kind`/`id`.'
      properties:
        seed:
          description: Id of the session node the graph is seeded from.
          examples:
          - file:protokoll.md
          title: Seed
          type: string
        nodes:
          items:
            $ref: '#/components/schemas/SessionGraphNode'
          title: Nodes
          type: array
        edges:
          items:
            $ref: '#/components/schemas/SessionGraphEdge'
          title: Edges
          type: array
        hidden:
          description: Count of nodes folded away by the visibility cap.
          examples:
          - 0
          title: Hidden
          type: integer
        kind:
          const: graph
          default: graph
          title: Kind
          type: string
        id:
          description: Identity a user action refers back to.
          examples:
          - graph:session
          title: Id
          type: string
      required:
      - seed
      - hidden
      - id
      title: GraphIntent
      type: object
    KnowledgeHit:
      description: 'One matching note for the current topic (`blocks/knowledge_link`,

        issue #148, closing design partner''s issue #144): no model, no

        network -- notes whose name or tags occur in the topic title, plus

        their link neighbours.'
      properties:
        kind:
          description: The note's frontmatter `type:`, or its top folder when that
            is absent.
          examples:
          - finance
          title: Kind
          type: string
        title:
          description: The note's frontmatter `title:`, its first `# ` heading, or
            its file stem.
          examples:
          - Budget overview
          title: Title
          type: string
        href:
          description: The note's path, relative to the wiki root.
          examples:
          - ablage/budget.md
          title: Href
          type: string
      required:
      - kind
      - title
      - href
      title: KnowledgeHit
      type: object
    KnowledgeIntent:
      description: '`knowledge:<topic_id>`: the knowledge-link block''s view intent

        (kind `knowledge`, issue #148); the same shape as

        `StageStateSnapshot.knowledge`, plus the envelope''s `kind`/`id`.'
      properties:
        topic_id:
          description: Identity of the topic these hits belong to.
          examples:
          - t1
          title: Topic Id
          type: string
        query:
          description: The topic title the hits were matched against.
          examples:
          - Budget and heating plan
          title: Query
          type: string
        hits:
          description: Matching notes, best first.
          items:
            $ref: '#/components/schemas/KnowledgeHit'
          title: Hits
          type: array
        kind:
          const: knowledge
          default: knowledge
          title: Kind
          type: string
        id:
          description: Identity a user action refers back to.
          examples:
          - knowledge:t1
          title: Id
          type: string
      required:
      - topic_id
      - query
      - id
      title: KnowledgeIntent
      type: object
    ListenClose:
      description: '`ListenSnapshot.last_close`: how the most recent call window ended

        (`gateway.segmenter.BlockBuilder.state()`''s own shape).'
      properties:
        reason:
          description: 'How the call closed: the end phrase, a tap, a silence timeout,
            the call''s own max duration, or a tap on an empty window (cancel, nothing
            sent).'
          enum:
          - end
          - tap
          - silence
          - max
          - cancel
          examples:
          - end
          title: Reason
          type: string
        at:
          description: Epoch seconds the call closed.
          examples:
          - 1732450920.0
          title: At
          type: number
      required:
      - reason
      - at
      title: ListenClose
      type: object
    ListenIntent:
      description: '`listen:room`: the call-window block''s view intent (kind `listen`,

        issue #180, ADR 0024); the same shape as `StageStateSnapshot.listen`.'
      properties:
        kind:
          const: listen
          default: listen
          title: Kind
          type: string
        id:
          description: Identity a user action refers back to.
          examples:
          - listen:room
          title: Id
          type: string
        state:
          default: idle
          enum:
          - idle
          - listening
          examples:
          - idle
          title: State
          type: string
        since:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          examples:
          - null
          title: Since
        opened_by:
          anyOf:
          - enum:
            - voice
            - tap
            type: string
          - type: 'null'
          default: null
          examples:
          - null
          title: Opened By
        closes_in_s:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          examples:
          - null
          title: Closes In S
        last_close:
          anyOf:
          - $ref: '#/components/schemas/ListenClose'
          - type: 'null'
          default: null
      required:
      - id
      title: ListenIntent
      type: object
    PromptIntent:
      properties:
        kind:
          const: prompt
          default: prompt
          title: Kind
          type: string
        id:
          description: Identity a user action refers back to.
          examples:
          - VI1
          title: Id
          type: string
        to_person:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Who the prompt is directed at; `None` is everyone.
          examples:
          - Mira
          title: To Person
        text:
          description: The prompt text.
          examples:
          - What is one expectation for today?
          title: Text
          type: string
      required:
      - id
      - text
      title: PromptIntent
      type: object
    QueueIntent:
      description: '`queue:room`: the speaker-queue block''s view intent (kind `queue`,

        `blocks/speaker_queue/__init__.py::_emit_view()`); the same shape as

        `StageStateSnapshot.queue`.'
      properties:
        kind:
          const: queue
          default: queue
          title: Kind
          type: string
        id:
          description: Identity a user action refers back to.
          examples:
          - queue:room
          title: Id
          type: string
        mode:
          const: tap
          default: tap
          description: How seats join the queue; only `tap` exists today.
          examples:
          - tap
          title: Mode
          type: string
        speaking:
          anyOf:
          - $ref: '#/components/schemas/QueueSeat'
          - type: 'null'
          default: null
          description: Who currently holds the floor; `None` when nobody does.
        waiting:
          description: Seats waiting their turn, in order.
          items:
            $ref: '#/components/schemas/QueueSeat'
          title: Waiting
          type: array
        round:
          default: null
          description: Reserved for a future round-based queue mode; always `None`
            today.
          title: Round
          type: 'null'
      required:
      - id
      title: QueueIntent
      type: object
    QueueSeat:
      description: One seat in the speaker queue (`blocks/speaker_queue/__init__.py`).
      properties:
        pid:
          description: The seat's participant id.
          examples:
          - P1
          title: Pid
          type: string
        name:
          description: Display name for the seat.
          examples:
          - Mira
          title: Name
          type: string
      required:
      - pid
      - name
      title: QueueSeat
      type: object
    SessionGraphEdge:
      description: One edge of `blocks/graph/session_graph.py::build_session_graph()`.
      properties:
        id:
          description: Edge identity.
          examples:
          - e:1
          title: Id
          type: string
        source:
          description: Id of the edge's source node.
          examples:
          - file:protokoll.md
          title: Source
          type: string
        target:
          description: Id of the edge's target node.
          examples:
          - t1
          title: Target
          type: string
        kind:
          description: '`entry`, `block`, `wikilink`, or a vault edge kind.'
          examples:
          - entry
          title: Kind
          type: string
        ring:
          description: The ring the edge belongs to.
          examples:
          - 0
          title: Ring
          type: integer
      required:
      - id
      - source
      - target
      - kind
      - ring
      title: SessionGraphEdge
      type: object
    SessionGraphNode:
      description: One node of `blocks/graph/session_graph.py::build_session_graph()`.
      properties:
        id:
          description: Node identity.
          examples:
          - file:protokoll.md
          title: Id
          type: string
        label:
          description: Label shown for the node.
          examples:
          - Quarterly planning
          title: Label
          type: string
        kind:
          description: '`session`, `topic`, `entry` or `note`.'
          examples:
          - session
          title: Kind
          type: string
        ring:
          description: 0 for the session and its structure, 1 for linked notes, 2
            for their neighbours.
          examples:
          - 0
          title: Ring
          type: integer
        href:
          default: ''
          description: Where the node links to, if anywhere.
          examples:
          - ''
          title: Href
          type: string
        time:
          default: ''
          description: Wall-clock label attached to the node, if any.
          examples:
          - ''
          title: Time
          type: string
        tag:
          default: ''
          description: The entry's tag, if the node is an entry.
          examples:
          - ''
          title: Tag
          type: string
        parent:
          default: ''
          description: The id of the node this one hangs off of.
          examples:
          - file:protokoll.md
          title: Parent
          type: string
        hidden:
          default: false
          description: Whether the visibility cap folds this node away.
          examples:
          - false
          title: Hidden
          type: boolean
        grace:
          default: false
          description: Whether the node is kept only by the ring-selection hysteresis
            grace window.
          examples:
          - false
          title: Grace
          type: boolean
      required:
      - id
      - label
      - kind
      - ring
      title: SessionGraphNode
      type: object
    ShareIntent:
      description: '`share:room`: the speaking-share block''s view intent (kind `share`,

        `blocks/speaking_share/__init__.py::_on_tick()`); the same shape as

        `StageStateSnapshot.share`.'
      properties:
        kind:
          const: share
          default: share
          title: Kind
          type: string
        id:
          description: Identity a user action refers back to.
          examples:
          - share:room
          title: Id
          type: string
        shares:
          description: Per-person talk-share rows; empty while nobody has spoken yet.
          items:
            $ref: '#/components/schemas/ShareRow'
          title: Shares
          type: array
        total_words:
          description: Total words counted so far across everyone.
          examples:
          - 400
          title: Total Words
          type: integer
      required:
      - id
      - total_words
      title: ShareIntent
      type: object
    ShareRow:
      description: One row of `blocks/speaking_share/talk_share.py`'s `talk_share`
        event.
      properties:
        person:
          description: Placeholder person id.
          examples:
          - P1
          title: Person
          type: string
        role_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: The person's bound role, if known.
          examples:
          - null
          title: Role Id
        words:
          description: Words counted for this person so far.
          examples:
          - 123
          title: Words
          type: integer
        share:
          description: This person's share of `total_words`, 0..1.
          examples:
          - 0.31
          title: Share
          type: number
        given:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: The role's given name, only present when known.
          examples:
          - null
          title: Given
      required:
      - person
      - words
      - share
      title: ShareRow
      type: object
    StatusIntent:
      properties:
        kind:
          const: status
          default: status
          title: Kind
          type: string
        id:
          description: Identity a user action refers back to.
          examples:
          - VI4
          title: Id
          type: string
        text:
          description: The status line text.
          examples:
          - Recording
          title: Text
          type: string
        severity:
          default: info
          enum:
          - info
          - warning
          - error
          examples:
          - info
          title: Severity
          type: string
      required:
      - id
      - text
      title: StatusIntent
      type: object
    Task:
      properties:
        text:
          description: The task text.
          examples:
          - Send the updated timeline to the vendor.
          title: Text
          type: string
        person:
          default: ''
          description: Who owns it; empty when the meeting did not name anyone.
          examples:
          - Jonas
          title: Person
          type: string
        due:
          default: ''
          description: Due date, as named by the meeting; empty when not named.
          examples:
          - '2026-12-01'
          title: Due
          type: string
      required:
      - text
      title: Task
      type: object
    TasksIntent:
      description: 'Tasks named by the meeting, from `decisions-tasks-questions`.
        Not wired yet, see issue #129.'
      properties:
        kind:
          const: tasks
          default: tasks
          title: Kind
          type: string
        id:
          description: Identity a user action refers back to.
          examples:
          - VI7
          title: Id
          type: string
        tasks:
          description: Tasks named by the meeting so far.
          examples:
          - []
          items:
            $ref: '#/components/schemas/Task'
          title: Tasks
          type: array
      required:
      - id
      - tasks
      title: TasksIntent
      type: object
      x-issue: https://github.com/birkschmithuesen/cothinker/issues/129
      x-status: planned
    TimerIntent:
      properties:
        kind:
          const: timer
          default: timer
          title: Kind
          type: string
        id:
          description: Identity a user action refers back to.
          examples:
          - VI3
          title: Id
          type: string
        label:
          description: Label shown next to the timer.
          examples:
          - 'Retro: what worked'
          title: Label
          type: string
        remaining_s:
          description: Seconds remaining on this timer.
          examples:
          - 480.0
          title: Remaining S
          type: number
        budget_s:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: The timer's total budget in seconds.
          examples:
          - 600.0
          title: Budget S
        items:
          anyOf:
          - items:
              $ref: '#/components/schemas/AgendaItemSummary'
            type: array
          - type: 'null'
          default: null
          description: 'The whole agenda as a list of items, not just the current
            one; the core does not wire this up yet (issue #129).'
          examples:
          - null
          title: Items
          x-issue: https://github.com/birkschmithuesen/cothinker/issues/129
          x-status: planned
      required:
      - id
      - label
      - remaining_s
      title: TimerIntent
      type: object
    TranscriptLine:
      properties:
        speaker:
          default: ''
          description: Who said it; empty when attribution is unsure.
          examples:
          - Tamar
          title: Speaker
          type: string
        started_at:
          description: Wall-clock label of when the line started.
          examples:
          - '2026-11-23T09:14:02+01:00'
          title: Started At
          type: string
        text:
          description: The transcribed text.
          examples:
          - Let's park the vendor question for now.
          title: Text
          type: string
      required:
      - started_at
      - text
      title: TranscriptLine
      type: object
    TranscriptRecentIntent:
      description: 'The last three contributions. Not wired yet, see issue #129.'
      properties:
        kind:
          const: transcript:recent
          default: transcript:recent
          title: Kind
          type: string
        id:
          description: Identity a user action refers back to.
          examples:
          - VI6
          title: Id
          type: string
        lines:
          description: The last three contributions, oldest first.
          examples:
          - []
          items:
            $ref: '#/components/schemas/TranscriptLine'
          title: Lines
          type: array
      required:
      - id
      - lines
      title: TranscriptRecentIntent
      type: object
      x-issue: https://github.com/birkschmithuesen/cothinker/issues/129
      x-status: planned
    VoiceIntent:
      description: '`voice:room`: the voice-attribution block''s view intent (kind

        `voice`, `blocks/voice_attribution/__init__.py`); the same shape as

        `StageStateSnapshot.voice`.'
      properties:
        kind:
          const: voice
          default: voice
          title: Kind
          type: string
        id:
          description: Identity a user action refers back to.
          examples:
          - voice:room
          title: Id
          type: string
        speaking:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Display name of the participant whose track is currently active;
            `None` when nobody is.
          examples:
          - Mira
          title: Speaking
        since:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Wall-clock label of when `speaking` started; `None` when `speaking`
            is `None`.
          examples:
          - '2026-11-23T09:12:00+01:00'
          title: Since
        recent:
          description: The last 5 distinct speakers before `speaking`, newest first.
          items:
            $ref: '#/components/schemas/VoiceRecentEntry'
          title: Recent
          type: array
      required:
      - id
      title: VoiceIntent
      type: object
    VoiceRecentEntry:
      description: 'One entry of `voice.recent`: a distinct past speaker and when
        they

        were last heard.'
      properties:
        name:
          description: Display name of a past speaker.
          examples:
          - Jonas
          title: Name
          type: string
        last_at:
          description: Wall-clock label of when this person was last heard speaking.
          examples:
          - '2026-11-23T09:10:00+01:00'
          title: Last At
          type: string
      required:
      - name
      - last_at
      title: VoiceRecentEntry
      type: object
    ViewIntent:
      discriminator:
        mapping:
          artefact: '#/components/schemas/ArtefactIntent'
          choice_list: '#/components/schemas/ChoiceIntent'
          graph: '#/components/schemas/GraphIntent'
          knowledge: '#/components/schemas/KnowledgeIntent'
          listen: '#/components/schemas/ListenIntent'
          prompt: '#/components/schemas/PromptIntent'
          queue: '#/components/schemas/QueueIntent'
          share: '#/components/schemas/ShareIntent'
          status: '#/components/schemas/StatusIntent'
          tasks: '#/components/schemas/TasksIntent'
          timer: '#/components/schemas/TimerIntent'
          transcript:recent: '#/components/schemas/TranscriptRecentIntent'
          voice: '#/components/schemas/VoiceIntent'
        propertyName: kind
      oneOf:
      - $ref: '#/components/schemas/PromptIntent'
      - $ref: '#/components/schemas/ChoiceIntent'
      - $ref: '#/components/schemas/TimerIntent'
      - $ref: '#/components/schemas/StatusIntent'
      - $ref: '#/components/schemas/ArtefactIntent'
      - $ref: '#/components/schemas/QueueIntent'
      - $ref: '#/components/schemas/VoiceIntent'
      - $ref: '#/components/schemas/ShareIntent'
      - $ref: '#/components/schemas/GraphIntent'
      - $ref: '#/components/schemas/KnowledgeIntent'
      - $ref: '#/components/schemas/TranscriptRecentIntent'
      - $ref: '#/components/schemas/TasksIntent'
      - $ref: '#/components/schemas/ListenIntent'
