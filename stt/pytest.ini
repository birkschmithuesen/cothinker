[pytest]
# The imported tree had no pytest.ini of its own -- fundusbot's lived at
# its repo root and also listed botserver/ and tts_server/, which did not
# come along. These are the two test trees that did.
testpaths =
    fundusapps/stt_server/tests
    fundusapps/common/tests
    fundusapps/bbb_tap/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Everything that needs hardware, a model on disk or CUDA is off by
# default. test_whisper_backend.py's fixture loads large-v3-turbo on CUDA
# and hangs for minutes on a machine without a GPU, so this line is not a
# convenience -- without it the suite never finishes here.
addopts = -m "not needs_whisper and not needs_vosk_model and not needs_audio_device"
markers =
    needs_vosk_model: requires a vosk model on disk
    needs_whisper: requires faster-whisper installed and CUDA available
    needs_audio_device: requires a working sounddevice input device
filterwarnings =
    ignore::DeprecationWarning
