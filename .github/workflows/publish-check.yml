name: publish-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  publish-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # On a pull_request event, actions/checkout's default ref is the
          # synthetic merge commit (refs/pull/<n>/merge), whose author and
          # committer metadata are the PR author's real GitHub-registered
          # address and GitHub's own bot identity -- both real,
          # non-placeholder addresses that publish_check.py's email-real
          # class correctly flags. Pin to the PR's actual head SHA instead,
          # so the gate scans the contributor's own commits, not a merge
          # commit GitHub synthesizes and that is never pushed anywhere.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - run: pip install detect-secrets
      - env:
          COTHINKER_DENYLIST_KEY: ${{ secrets.COTHINKER_DENYLIST_KEY }}
        run: python3 tools/publish_check.py --repo . --hmac ci-denylist.hmac
