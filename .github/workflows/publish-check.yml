name: publish-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  publish-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - run: pip install detect-secrets
      - env:
          COTHINKER_DENYLIST_KEY: ${{ secrets.COTHINKER_DENYLIST_KEY }}
        run: python3 tools/publish_check.py --repo . --hmac ci-denylist.hmac
