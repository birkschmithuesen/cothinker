name: adr-immutable
on: [pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # Same reasoning as dco.yml / publish-check.yml: scan the PR's
          # real head, not the default pull_request merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q tests/test_adr_immutable.py
      # Accepted ADRs may only change their status line (docs/adr/README.md).
      - run: python scripts/check_adr_immutable.py --base "origin/${{ github.base_ref }}"
