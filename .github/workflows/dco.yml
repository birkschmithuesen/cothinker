name: dco
on: [pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # Checking out the pull_request event's default merge commit would
          # add a synthetic "Merge ... into ..." commit, with neither a
          # Signed-off-by: trailer nor a placeholder identity, to the range
          # scanned below -- check_dco.py would then fail on a commit that
          # is never actually pushed anywhere. Scan the PR's real head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q tests/test_dco.py
      # Every commit of the PR needs a DCO Signed-off-by: trailer (CONTRIBUTING.md §2).
      - run: python scripts/check_dco.py --base "origin/${{ github.base_ref }}"
